services:
  - type: web
    name: mandisetu-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandisetu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENWEATHER_API_KEY
        value: 45f0ee74bec083ada9f8a8c45bc7e103
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ENVIRONMENT
        value: production

databases:
  - name: mandisetu-db
    databaseName: mandisetu
    plan: free
