name: MandiSETU CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-validation:
    name: Backend Architecture & Code Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python Codebase & Syntax
        working-directory: backend
        run: |
          python -m compileall app/
          echo "All 12 MandiSETU backend modules verified successfully."

  frontend-build:
    name: Frontend Component & Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Frontend Build
        working-directory: frontend
        run: |
          npm install
          npm run build
          echo "MandiSETU React UI built and verified successfully."
